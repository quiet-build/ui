name: Publish to npm

# Push a tag like `v0.6.0` (created by `npm version minor` or manually) and
# this workflow will verify, build, and publish to npm. `workflow_dispatch`
# allows re-running a failed release from the Actions tab without re-tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v0.6.0). Defaults to the current branch HEAD.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write   # required for npm provenance via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch with a `ref` input, check that ref out;
          # otherwise default to the tag/branch that triggered the run.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # OIDC-based Trusted Publishing requires npm CLI >= 11.5.1. Node 22
      # bundles npm 10.x by default, which falls back to token auth and 404s.
      - name: Upgrade npm to an OIDC-capable version (>=11.5.1)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          # Resolve the version source: input ref, push tag, or current commit.
          REF="${{ inputs.ref || github.ref_name }}"
          TAG_VERSION="${REF#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag/ref:  $REF (parsed: $TAG_VERSION)"
          echo "Package:  $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - run: npm ci

      # vitest browser mode uses Playwright Chromium. Cache ~/.cache/ms-playwright
      # keyed on the Playwright version so the binary download (~50s) only runs
      # when Playwright is actually upgraded. GitHub Actions evicts cache entries
      # after 7 days of no access, so infrequent releases may still miss.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Even on cache hit, system shared libraries may need refreshing on a new
      # runner image. install-deps is fast (~5s) and idempotent.
      - name: Ensure Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Auth happens via Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
      # Configure once at: npmjs.com → @quietbuildlab/ui → Settings → Trusted publishing.
      # Provenance is automatic when publishing via OIDC, but pass --provenance
      # explicitly so the intent is visible in the workflow.
      - name: Publish to npm
        run: npm publish --access public --provenance
